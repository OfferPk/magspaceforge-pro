<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b16"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bgG)"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1000" height="52" fill="#020617" stroke="#1e293b"/>
  <rect x="24" y="10" width="32" height="32" rx="6" fill="#0ea5e9"/>
  <text x="31" y="32" fill="#020617" font-family="JetBrains Mono" font-weight="bold" font-size="14">MAG</text>
  <text x="68" y="28" fill="#ffffff" font-family="Inter" font-weight="bold" font-size="15">MagSpaceForge Pro</text>
  <text x="68" y="44" fill="#94a3b8" font-family="Inter" font-size="10">ECSS-E-ST-60-30C &amp; ECSS-E-ST-20-07C Rev. 2 Spacecraft Magnetic Cleanliness Studio</text>
  <rect x="850" y="12" width="125" height="28" rx="6" fill="#0ea5e9"/>
  <text x="862" y="30" fill="#020617" font-family="JetBrains Mono" font-weight="bold" font-size="11">EXPORT XML</text>

  <!-- 5 Top KPI Cards -->
  <g transform="translate(24, 68)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="180" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="14" y="20" fill="#94a3b8" font-family="JetBrains Mono" font-size="10">RESIDUAL DIPOLE M_RES</text>
    <text x="14" y="46" fill="#38bdf8" font-family="JetBrains Mono" font-size="18" font-weight="bold">0.0430 A·m²</text>
    <text x="14" y="64" fill="#34d399" font-family="JetBrains Mono" font-size="10">ECSS: ≤ 0.100 A·m²</text>

    <!-- Card 2 -->
    <rect x="193" y="0" width="180" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="207" y="20" fill="#94a3b8" font-family="JetBrains Mono" font-size="10">BOOM STRAY FIELD</text>
    <text x="207" y="46" fill="#34d399" font-family="JetBrains Mono" font-size="18" font-weight="bold">1.91 nT</text>
    <text x="207" y="64" fill="#94a3b8" font-family="JetBrains Mono" font-size="10">Boom: 1.65 m (≤ 10 nT)</text>

    <!-- Card 3 -->
    <rect x="386" y="0" width="180" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="400" y="20" fill="#94a3b8" font-family="JetBrains Mono" font-size="10">MTQ MAGNETIC MOMENT</text>
    <text x="400" y="46" fill="#ffffff" font-family="JetBrains Mono" font-size="18" font-weight="bold">11.16 A·m²</text>
    <text x="400" y="64" fill="#38bdf8" font-family="JetBrains Mono" font-size="10">Power: 5.74 W (μ=48.4)</text>

    <!-- Card 4 -->
    <rect x="579" y="0" width="180" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="593" y="20" fill="#94a3b8" font-family="JetBrains Mono" font-size="10">B-DOT DETUMBLE RATE</text>
    <text x="593" y="46" fill="#34d399" font-family="JetBrains Mono" font-size="18" font-weight="bold">0.48 Orbits</text>
    <text x="593" y="64" fill="#94a3b8" font-family="JetBrains Mono" font-size="10">RW Desat: 34.5 min</text>

    <!-- Card 5 -->
    <rect x="772" y="0" width="180" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="786" y="20" fill="#94a3b8" font-family="JetBrains Mono" font-size="10">ECSS-E-ST-60-30C AUDIT</text>
    <text x="786" y="46" fill="#34d399" font-family="JetBrains Mono" font-size="18" font-weight="bold">10 / 10 PASS</text>
    <text x="786" y="64" fill="#34d399" font-family="JetBrains Mono" font-size="10">CLEANROOM CERTIFIED</text>
  </g>

  <!-- Main Grid: Left Controls (300px) + Right Waveform (630px) -->
  <g transform="translate(24, 158)">
    <!-- Left Controls Panel -->
    <rect x="0" y="0" width="310" height="415" rx="10" fill="#0b1426" stroke="#1e293b"/>
    <text x="16" y="26" fill="#ffffff" font-family="Inter" font-weight="bold" font-size="12">1. MISSION &amp; ACTUATOR SPECS</text>
    <line x1="16" y1="36" x2="294" y2="36" stroke="#1e293b"/>
    
    <text x="16" y="60" fill="#94a3b8" font-family="Inter" font-size="11">Orbit Altitude (km): 500 km</text>
    <rect x="16" y="68" width="278" height="6" rx="3" fill="#1e293b"/>
    <rect x="16" y="68" width="55" height="6" rx="3" fill="#38bdf8"/>

    <text x="16" y="100" fill="#94a3b8" font-family="Inter" font-size="11">Spacecraft Mass: 180 kg</text>
    <rect x="16" y="108" width="278" height="6" rx="3" fill="#1e293b"/>
    <rect x="16" y="108" width="90" height="6" rx="3" fill="#38bdf8"/>

    <text x="16" y="140" fill="#94a3b8" font-family="Inter" font-size="11">Boom Length: 1.65 m</text>
    <rect x="16" y="148" width="278" height="6" rx="3" fill="#1e293b"/>
    <rect x="16" y="148" width="115" height="6" rx="3" fill="#38bdf8"/>

    <text x="16" y="180" fill="#94a3b8" font-family="Inter" font-size="11">Reaction Wheel Momentum: 0.60 Nms</text>
    <rect x="16" y="188" width="278" height="6" rx="3" fill="#1e293b"/>
    <rect x="16" y="188" width="70" height="6" rx="3" fill="#38bdf8"/>

    <text x="16" y="220" fill="#94a3b8" font-family="Inter" font-size="11">Torquerod Core Length: 0.32 m</text>
    <rect x="16" y="228" width="278" height="6" rx="3" fill="#1e293b"/>
    <rect x="16" y="228" width="130" height="6" rx="3" fill="#38bdf8"/>

    <text x="16" y="260" fill="#94a3b8" font-family="Inter" font-size="11">Torquerod Diameter: 16.0 mm</text>
    <rect x="16" y="268" width="278" height="6" rx="3" fill="#1e293b"/>
    <rect x="16" y="268" width="140" height="6" rx="3" fill="#38bdf8"/>

    <text x="16" y="300" fill="#94a3b8" font-family="Inter" font-size="11">Coil Wire Turns: 2400 turns</text>
    <rect x="16" y="308" width="278" height="6" rx="3" fill="#1e293b"/>
    <rect x="16" y="308" width="160" height="6" rx="3" fill="#38bdf8"/>

    <!-- Right Waveform & Results Panel -->
    <rect x="330" y="0" width="622" height="415" rx="10" fill="#0b1426" stroke="#1e293b"/>
    <text x="348" y="26" fill="#ffffff" font-family="Inter" font-weight="bold" font-size="12">2. ORBITAL B-DOT KINETIC DAMPING &amp; MTQ WAVEFORM</text>
    <line x1="348" y1="36" x2="932" y2="36" stroke="#1e293b"/>

    <!-- SVG Graph Container -->
    <rect x="348" y="48" width="584" height="200" rx="8" fill="#060b16" stroke="#1e293b"/>
    <!-- Simulated Curves -->
    <path d="M 370 70 Q 420 180 500 215 T 700 230 T 910 232" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 370 80 Q 430 190 520 220 T 720 232 T 910 234" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M 370 230 Q 460 210 550 140 T 740 75 T 910 65" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="365" y="65" fill="#38bdf8" font-family="JetBrains Mono" font-size="10">Tip-Off Rate ω(t): 8.5°/s → 0.1°/s</text>
    <text x="680" y="65" fill="#34d399" font-family="JetBrains Mono" font-size="10">RW Momentum Relief: 100%</text>

    <!-- 3 Subcards below graph -->
    <rect x="348" y="260" width="185" height="138" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="360" y="280" fill="#94a3b8" font-family="JetBrains Mono" font-size="10" font-weight="bold">GEOMAGNETIC</text>
    <text x="360" y="302" fill="#ffffff" font-family="JetBrains Mono" font-size="10">Alt: 500.0 km SSO</text>
    <text x="360" y="322" fill="#38bdf8" font-family="JetBrains Mono" font-size="10">|B| = 39,326.7 nT</text>
    <text x="360" y="342" fill="#94a3b8" font-family="JetBrains Mono" font-size="10">Br: -28.5 μT</text>
    <text x="360" y="362" fill="#34d399" font-family="JetBrains Mono" font-size="10">T_orb: 94.5 min</text>

    <rect x="548" y="260" width="185" height="138" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="560" y="280" fill="#94a3b8" font-family="JetBrains Mono" font-size="10" font-weight="bold">TORQUEROD COIL</text>
    <text x="560" y="302" fill="#ffffff" font-family="JetBrains Mono" font-size="10">L/D: 20.0 (Nd=0.0206)</text>
    <text x="560" y="322" fill="#38bdf8" font-family="JetBrains Mono" font-size="10">μ_eff: 48.4</text>
    <text x="560" y="342" fill="#94a3b8" font-family="JetBrains Mono" font-size="10">R: 25.10 Ω @ 35°C</text>
    <text x="560" y="362" fill="#34d399" font-family="JetBrains Mono" font-size="10">Power: 5.74 W</text>

    <rect x="747" y="260" width="185" height="138" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="759" y="280" fill="#94a3b8" font-family="JetBrains Mono" font-size="10" font-weight="bold">ATTITUDE ACTUATION</text>
    <text x="759" y="302" fill="#ffffff" font-family="JetBrains Mono" font-size="10">Tau_max: 438.9 μNm</text>
    <text x="759" y="322" fill="#34d399" font-family="JetBrains Mono" font-size="10">Margin: +25,859%</text>
    <text x="759" y="342" fill="#38bdf8" font-family="JetBrains Mono" font-size="10">RW Desat: 34.5 min</text>
    <text x="759" y="362" fill="#34d399" font-family="JetBrains Mono" font-size="10">Detumble: 0.48 orb</text>
  </g>
</svg>
